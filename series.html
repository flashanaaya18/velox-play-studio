<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0A0D1A" />
<meta name="color-scheme" content="dark" />
<title>Series en Latino — Velox Play</title>
<meta name="description" content="Catálogo de series en audio Latino. Filtra por novedades, nuevas temporadas y nuevos episodios." />
<meta name="robots" content="index,follow" />
<link rel="canonical" href="https://flashanaaya18.github.io/velox-play-studio/series.html" />
<link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="css/styles.css" />
<style>
  .cat-header { max-width: 1400px; margin: 0 auto; padding: 24px 16px 8px; }
  .cat-header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; margin: 0 0 6px; }
  .cat-header p { color: var(--text-dim); margin: 0 0 14px; }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--text-dim); background: var(--surface); border: 1px solid var(--border); cursor: pointer; transition: all .2s; }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip.is-active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cat-grid { max-width: 1400px; margin: 0 auto; padding: 8px 16px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
  .cat-estado { max-width: 1400px; margin: 0 auto; padding: 0 16px 24px; color: var(--text-fade); font-size: 13px; text-align: center; }
  @media (max-width: 480px) {
    .cat-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .cat-header h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="topbar__inner">
    <a href="index.html" class="brand" aria-label="Velox Play inicio">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E50914"/><stop offset="1" stop-color="#FF6B2C"/></linearGradient></defs>
        <rect width="32" height="32" rx="8" fill="url(#bg)"/><path d="M10 9 L22 16 L10 23 Z" fill="#fff"/>
      </svg>
      <span class="brand__name">Velox<span>Play</span></span>
    </a>
    <button class="nav-toggle" type="button" id="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav" aria-label="Principal" id="nav">
      <a href="index.html" class="nav__link">Inicio</a>
      <a href="peliculas.html" class="nav__link">Películas</a>
      <a href="series.html" class="nav__link is-active">Series</a>
      <a href="app.html" class="nav__link">App</a>
    </nav>
  </div>
</header>

<main>
  <section class="cat-header">
    <h1>Series</h1>
    <p>Catálogo completo en audio Latino. Filtra por categoría.</p>
    <div class="filtros" id="filtros" role="tablist" aria-label="Filtros de series"></div>
  </section>

  <section class="cat-grid" id="grid" aria-label="Lista de series"></section>
  <div class="cat-estado" id="estado" aria-live="polite"></div>
</main>

<footer class="footer">
  <div class="footer__inner">
    <div class="footer__brand">
      <span>Velox<strong>Play</strong></span>
      <p>© <span id="y"></span> Velox Play.</p>
    </div>
    <nav class="footer__nav" aria-label="Pie de página">
      <a href="index.html">Inicio</a>
      <a href="peliculas.html">Películas</a>
      <a href="series.html">Series</a>
      <a href="app.html">App</a>
      <a href="sitemap.xml">Sitemap</a>
    </nav>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/detalle.js"></script>
<script src="js/catalogo.js"></script>
<script>
  document.getElementById('y').textContent = new Date().getFullYear();
  (function () {
    const nav = document.getElementById('nav'), t = document.getElementById('nav-toggle');
    if (!nav || !t) return;
    t.addEventListener('click', () => {
      const abierto = nav.classList.toggle('is-open');
      t.setAttribute('aria-expanded', abierto ? 'true' : 'false');
    });
  })();
  VeloxCatalogo({
    vista: 'series',
    gridSel: '#grid',
    filtrosSel: '#filtros',
    estadoSel: '#estado',
    filtros: [
      { key: 'novedades',    label: 'Novedades',         query: '' },
      { key: 'populares',    label: 'Más populares',     query: 'order=calificacion.desc.nullslast' },
      { key: 'temporadas',   label: 'Nuevas temporadas', query: 'temporada_nueva=eq.true' },
      { key: 'episodios',    label: 'Nuevos episodios',  query: 'episodio_nuevo=eq.true' }
    ]
  });
</script>
</body>
</html>
