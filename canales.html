<style>
  .cat-header { max-width: 1400px; margin: 0 auto; padding: 24px 16px 8px; }
  .cat-header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; margin: 0 0 6px; }
  .cat-header p { color: var(--text-dim); margin: 0 0 14px; }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--text-dim); background: var(--surface); border: 1px solid var(--border); cursor: pointer; }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip.is-active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .buscar-canal { width: 100%; max-width: 420px; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; }
  .canales-grid { max-width: 1400px; margin: 0 auto; padding: 8px 16px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .canal { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 10px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); color: var(--text); cursor: pointer; text-align: center; font: inherit; transition: border-color .15s, transform .15s; }
  .canal:hover, .canal:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
  .canal__logo { width: 100%; height: 70px; display: flex; align-items: center; justify-content: center; }
  .canal__logo img { max-width: 100%; max-height: 70px; object-fit: contain; }
  .canal__ph { font-size: 34px; }
  .canal__nombre { font-weight: 600; font-size: 13.5px; line-height: 1.3; overflow-wrap: anywhere; }
  .canal__cat { font-size: 11.5px; color: var(--text-fade); }
  .cat-estado { max-width: 1400px; margin: 0 auto; padding: 0 16px 32px; color: var(--text-fade); font-size: 13px; text-align: center; }
  .tv-player { position: fixed; inset: 0; z-index: 120; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .tv-player[hidden] { display: none; }
  .tv-player__fondo { position: absolute; inset: 0; background: rgba(0,0,0,.88); }
  .tv-player__caja { position: relative; width: 100%; max-width: 1000px; }
  .tv-player__barra { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: #fff; margin-bottom: 8px; }
  .tv-player__barra h2 { margin: 0; font-size: 17px; font-family: 'Space Grotesk', sans-serif; }
  .tv-player__cerrar { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; font-size: 22px; flex-shrink: 0; }
  .tv-player video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; }
  .tv-player__aviso { color: var(--text-dim); font-size: 13px; min-height: 18px; margin-top: 8px; text-align: center; }
  @media (max-width: 480px) { .canales-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; } }
</style>
</head>

<header class="topbar" id="topbar">
  <div class="topbar__inner">

        <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E50914"/><stop offset="1" stop-color="#FF6B2C"/></linearGradient></defs>
        <rect width="32" height="32" rx="8" fill="url(#bg)"/><path d="M10 9 L22 16 L10 23 Z" fill="#fff"/>
      </svg>
      <span class="brand__name">Velox<span>Play</span></span>
    </a>
    <button class="nav-toggle" type="button" id="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav" aria-label="Principal" id="nav">
      <a href="index.html" class="nav__link">Inicio</a>
      <a href="peliculas.html" class="nav__link">Películas</a>
      <a href="series.html" class="nav__link">Series</a>
      <a href="canales.html" class="nav__link is-active">Canales</a>
      <a href="app.html" class="nav__link">App</a>
      <a href="vip.html" class="nav__link">VIP</a>
    </nav>
  </div>
</header>

<main>
  <section class="cat-header">
    <h1>Canales en vivo</h1>
    <p>Los mismos canales que en la app Velox Play. Elige una sección y toca un canal para verlo.</p>
    <div class="filtros" id="regiones" aria-label="Secciones de canales"></div>
    <input class="buscar-canal" id="buscar-canal" type="search" placeholder="Buscar canal…" aria-label="Buscar canal" autocomplete="off" />
  </section>
  <section class="canales-grid" id="grid" aria-label="Lista de canales"></section>
  <div class="ad-slot" data-ad="canales"></div>
  <div class="cat-estado" id="estado" aria-live="polite"></div>
</main>

<div class="tv-player" id="tv-player" hidden role="dialog" aria-modal="true" aria-labelledby="tv-titulo">
  <div class="tv-player__fondo" id="tv-fondo"></div>
  <div class="tv-player__caja">
    <div class="tv-player__barra">
      <h2 id="tv-titulo"></h2>
      <button class="tv-player__cerrar" type="button" id="tv-cerrar" aria-label="Cerrar">×</button>
    </div>
    <video id="tv-video" controls playsinline autoplay></video>
    <p class="tv-player__aviso" id="tv-aviso" aria-live="polite"></p>
  </div>
</div>
